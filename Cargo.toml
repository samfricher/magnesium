[package]
name = "magnesium"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
description = "Local workspace-attached learning support for the individual human learner"

[features]
default = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "magnesium"
path = "src/main.rs"

[dependencies]
atomicwrites = "=0.4.4"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.6", default-features = false, features = ["help", "std", "usage"] }
directories = "=6.0.0"
pdf-extract = "=0.12.0"
rmcp = { version = "=3.1.4", default-features = false, features = ["server"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled", "hooks"] }
same-file = "=1.0.6"
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_path_to_error = "=0.1.20"
sha2 = "=0.11.0"
hmac = "=0.13.0"
tokio = { version = "=1.53.1", default-features = false, features = ["io-std", "io-util", "rt", "sync", "time"] }
toml_edit = "=0.25.13"
tree-sitter = "=0.26.13"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
unicode-normalization = "=0.1.25"
getrandom = { version = "=0.2.17", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-permissions = "=0.2.4"

[dev-dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["trace"] }
support = { path = "tests/support" }

[build-dependencies]
serde_json = "=1.0.151"
