[package]
name = "magnesium-window"
version = "0.1.0"
edition = "2021"
description = "Magnesium's own window: one window, made for studying, over the learner's own coding agent."
license = "MIT OR Apache-2.0"

[[bin]]
name = "magnesium-window"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mg-core = { path = "../crates/core" }

# The Mac's share sheet (AirDrop, Mail) for a document: the same AppKit bindings the window's web view is built on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSSharingService", "NSView"] }
