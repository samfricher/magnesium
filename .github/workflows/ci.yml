name: Optional hosted validation

on:
  workflow_dispatch:
    inputs:
      run_cross_os:
        description: "Run full cross-OS matrix"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Opt-in only. Local validation owns ordinary merge readiness; see CONTRIBUTING.md.
  local-checks:
    name: "Core, Python, and docs (Linux x64)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Activate pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
      - name: Restore Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
      # Core builds the ordinary release binary and uses it for subprocess tests,
      # including smoke. Do not repeat those gates here.
      - name: Run canonical core, Python, and docs checks
        run: python ci/check.py core python docs

  # Additional platforms run only when selected in the manual dispatch.
  cross-os-core:
    name: "Core: ${{ matrix.architecture }}"
    runs-on: ${{ matrix.os }}
    needs: [local-checks]
    if: github.event_name == 'workflow_dispatch' && inputs.run_cross_os
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            architecture: Linux ARM64
          - os: macos-15-intel
            architecture: macOS x64
          - os: macos-15
            architecture: macOS ARM64
          - os: windows-2025
            architecture: Windows x64
          - os: windows-11-arm
            architecture: Windows ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Activate pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc -vV
      - name: Restore Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Run canonical core checks through the ordinary release executable
        run: python ci/check.py core
